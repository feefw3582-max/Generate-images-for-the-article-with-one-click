      - data:
          code: |-
            def main(query: str = '', files: list = None, final_article: str = '') -> dict:
                q = (query or '').strip()
                has_files = bool(files)
                has_article = bool((final_article or '').strip())

                # 1. 还没有带占位符的文稿 → 本轮是首次输入，进入分析
                if not has_article:
                    return {'route': 'analyze'}
                # 2. 调试暗号：charli → 视为已提供图片，直接走占位符替换（不生图、不传图）
                if 'charli' in q.lower():
                    return {'route': 'debug'}
                # 3. 已分析且本轮带了图片附件 → 用户回传图片
                if has_files:
                    return {'route': 'upload'}
                # 4. 已分析且消息包含生图意图 → 自动生图
                if any(k in q for k in ('生图', '生成图片', '自动配图', '生成图', '自动生', '画图')):
                    return {'route': 'gen'}
                # 5. 其他情况 → 提示用户二选一
                return {'route': 'unclear'}
          code_language: python3
