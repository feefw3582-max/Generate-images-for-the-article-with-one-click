      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          model:
            completion_params:
              max_tokens: 4096
              temperature: 0.7
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: sys-analyze
              role: system
              text: |-
                你是一位资深的知乎内容运营与 AI 配图专家。
                你的任务：阅读用户提供的知乎文字草稿，完成三件事。

                一、识别内容形式（必须是以下三种之一）：
                - 文章：篇幅较长、有完整结构与分段的深度内容；
                - 回答：针对某个具体问题的观点性回复，通常一到几段；
                - 想法：短小的个人表达、随感、动态（通常 200 字以内）。

                二、识别题材（用一句话概括，如：职场成长、情感、科技数码、历史人文、美食生活、社会热点评论等）并给出统一视觉风格建议（如：扁平插画、写实摄影、国潮风、3D 渲染、手绘速写等）。

                三、规划插图位并输出两样东西：
                1. article_with_placeholders：把用户的整篇草稿原文保留（可以适度润色但不得改变原意、不得删减段落），在每个适合插图的位置插入占位符。占位符必须严格使用这个格式（前后各带一个换行）：
                【为大大推荐在这里插入一张{图片类型}的图片哦～】
                例如：【为大大推荐在这里插入一张插画的图片哦～】
                适合插图的位置包括：段落转折处、核心论点旁、具体举例/数据处、情绪高点、结尾升华处。不要为了插图而插图。想法形式 1 处即可，文章形式最多 5 处。
                占位符中的「图片类型」必须与 insertions 数组中对应插图位的 image_type 完全一致；占位符数量必须与 insertions 数组长度一致。
                2. insertions：为每个插图位输出详细生图提示词：
                - image_type：图片类型（插画 / 摄影 / 信息图 / 示意图 / 海报）；
                - position_hint：用自然语言描述插图位置（如：开头、第二段之后、结尾升华段之前）；
                - prompt：详细生图提示词，包含主体、场景、风格、配色、构图、光线、氛围，中英结合，可直接用于 Seedream 文生图模型；所有插图位保持统一视觉风格。

                只输出一个 JSON 对象，不要输出任何其他文字、解释或 Markdown 代码块。JSON 结构如下：
                {
                  "format": "文章|回答|想法",
                  "theme": "题材一句话概述",
                  "style_suggestion": "统一视觉风格建议",
                  "article_with_placeholders": "完整文稿（含占位符）",
                  "insertions": [
                    {
                      "id": 1,
                      "image_type": "插画",
                      "position_hint": "第二段之后",
                      "prompt": "生图提示词"
                    }
                  ]
                }
            - id: user-analyze
              role: user
              text: |-
                以下是用户要发布的知乎文字草稿，请分析：

                {{#sys.query#}}
          selected: false
          title: 内容分析与插图规划
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: llm-analyze
        position:
