      - data:
          code: |-
            import json

            def main(llm_raw: str = '') -> dict:
                raw = (llm_raw or '').strip()
                # 清理 LLM 输出：去 Markdown 围栏，提取 {} 范围
                lines = raw.splitlines()
                if lines and lines[0].strip().startswith('```'):
                    lines = lines[1:]
                if lines and lines[-1].strip() == '```':
                    lines = lines[:-1]
                json_str = '\n'.join(lines)
                start = json_str.find('{')
                end = json_str.rfind('}')
                if start != -1 and end > start:
                    json_str = json_str[start:end + 1]

                data = {}
                parse_error = ''
                try:
                    data = json.loads(json_str)
                except Exception as e:
                    parse_error = str(e)
                if not isinstance(data, dict):
                    data = {}
                    if not parse_error:
                        parse_error = '解析结果不是 JSON 对象'

                fmt = str(data.get('format', '') or '文章')
                if fmt not in ('文章', '回答', '想法'):
                    fmt = '文章'
                theme = str(data.get('theme', '') or '未识别')
                style = str(data.get('style_suggestion', '') or '')
                article = str(data.get('article_with_placeholders', '') or '')

                insertions = []
                raw_ins = data.get('insertions')
                if isinstance(raw_ins, list):
                    for i, item in enumerate(raw_ins):
                        if not isinstance(item, dict):
                            continue
                        insertions.append({
                            'id': i + 1,
                            'image_type': str(item.get('image_type', '') or '插画').strip(),
                            'position_hint': str(item.get('position_hint', '') or '').strip(),
                            'prompt': str(item.get('prompt', '') or '').strip(),
                        })
                insertions_json = json.dumps(insertions, ensure_ascii=False)

                # 生成 Markdown 报告：每个插图位一个独立「卡片框」
                rep = ['## 内容分析']
                rep.append('- 形式：%s' % fmt)
                rep.append('- 题材：%s' % theme)
                if style:
                    rep.append('- 统一风格建议：%s' % style)
                rep.append('')
                rep.append('## 插图位提示词（共 %d 处）' % len(insertions))
                if not insertions:
                    rep.append('未能从草稿中识别出合适的插图位，请检查草稿内容。')
                for ins in insertions:
                    rep.append('')
                    rep.append('### 📌 插图位 %d · %s · %s' % (ins['id'], ins['image_type'], ins['position_hint'] or '位置待定'))
                    rep.append('> 提示词：%s' % ins['prompt'])
                rep.append('')
                rep.append('---')
                rep.append('**接下来二选一：**')
                rep.append('1. 回复 **「自动生图」** —— 我用 Seedream 5.0 Lite 按上方顺序批量生成图片并自动插入；')
                rep.append('2. 直接 **上传你的图片** —— 点击输入框的上传按钮，按插图位顺序选择图片，我会自动替换对应占位符。')
                report = '\n'.join(rep)

                return {
                    'format': fmt,
                    'theme': theme,
                    'style_suggestion': style,
                    'final_article': article,
                    'insertions_json': insertions_json,
                    'insertion_count': len(insertions),
                    'report': report,
                    'parse_error': parse_error,
                }
          code_language: python3
          desc: ''
          outputs:
            final_article:
              children: null
              type: string
            format:
              children: null
              type: string
            insertion_count:
              children: null
              type: number
            insertions_json:
              children: null
              type: string
            parse_error:
              children: null
              type: string
            report:
              children: null
              type: string
            style_suggestion:
              children: null
              type: string
            theme:
              children: null
              type: string
          selected: false
          title: 解析分析结果并生成文稿
          type: code
          variables:
            - value_selector:
                - llm-analyze
                - text
              variable: llm_raw
