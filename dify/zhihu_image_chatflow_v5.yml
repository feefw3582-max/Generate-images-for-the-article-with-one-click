      - data:
          code: |-
            import json

            def main(http_response: str = '') -> dict:
                raw = (http_response or '').strip()
                images = []
                log = []

                if not raw:
                    log.append('HTTP 响应为空。')
                    return {'seed_images': images, 'seed_parse_log': '\n'.join(log)}

                try:
                    obj = json.loads(raw)
                except Exception as e:
                    log.append('HTTP 响应不是合法 JSON：%s' % e)
                    log.append('响应前 300 字符：%s' % raw[:300])
                    return {'seed_images': images, 'seed_parse_log': '\n'.join(log)}

                def collect_urls(value):
                    found = []
                    if isinstance(value, str):
                        s = value.strip()
                        if s.startswith('http') or s.startswith('data:'):
                            found.append(s)
                    elif isinstance(value, dict):
                        for k in ('url', 'image_url', 'src', 'b64_json'):
                            if k in value and value[k]:
                                if k == 'b64_json':
                                    found.append('data:image/png;base64,' + str(value[k]).strip())
                                else:
                                    found.append(str(value[k]).strip())
                    elif isinstance(value, list):
                        for item in value:
                            found.extend(collect_urls(item))
                    return found

                if isinstance(obj, dict):
                    if 'data' in obj:
                        images.extend(collect_urls(obj['data']))
                    if not images:
                        for key in ('images', 'image', 'result', 'urls', 'output'):
                            if key in obj:
                                images.extend(collect_urls(obj[key]))
                        if not images:
                            images.extend(collect_urls(obj))
                elif isinstance(obj, list):
                    images.extend(collect_urls(obj))

                seen = set()
                clean = []
                for u in images:
                    u = (u or '').strip()
                    if u and u not in seen:
                        seen.add(u)
                        clean.append(u)

                log.append('从响应中解析到 %d 张图片。' % len(clean))
                if not clean:
                    log.append('未能从响应中提取图片 URL，请检查 Seedream API 返回格式（期望 OpenAI 风格 data[].url 或 data[].b64_json）。')
                return {'seed_images': clean, 'seed_parse_log': '\n'.join(log)}
