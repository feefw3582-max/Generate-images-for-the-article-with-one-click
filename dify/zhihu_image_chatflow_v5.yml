            def main(final_article: str = '', insertions_json: str = '') -> dict:
                text = final_article or ''
                try:
                    ins = json.loads(insertions_json or '[]')
                except Exception:
                    ins = []
                if not isinstance(ins, list):
                    ins = []
                log = []

                pattern = re.compile(r'\n*\s*【为大大推荐在这里插入一张([^】]*)的图片哦～】\s*\n*')

                out = []
                pos = 0
                idx = 0
                for m in pattern.finditer(text):
                    out.append(text[pos:m.start()])
                    img_type = (m.group(1) or '未知类型').strip()
                    hint = ''
                    if idx < len(ins) and isinstance(ins[idx], dict):
                        hint = str(ins[idx].get('position_hint', '') or '')
                    label = '🖼️【调试占位图片 %d：%s%s】' % (idx + 1, img_type, ('·' + hint) if hint else '')
                    out.append('\n\n%s\n\n' % label)
                    log.append('占位符 %d（%s）→ 已替换为调试标记。' % (idx + 1, img_type))
                    pos = m.end()
                    idx += 1
                out.append(text[pos:])

                if idx == 0:
                    log.append('⚠️ 未在会话文稿中找到任何占位符！说明第一轮「分析→保存文稿」环节可能未正常运行。')

                if idx != len(ins):
                    log.append('⚠️ 占位符数量（%d）与插图位数量（%d）不一致，请检查第一轮 LLM 输出的 article_with_placeholders 与 insertions 是否匹配。' % (idx, len(ins)))
                else:
                    log.append('✅ 占位符数量与插图位数量一致（%d 处），第一轮分析与保存链路正常。' % idx)

                log.append('✅ 调试路由命中：会话变量读取、路由分发、占位符替换逻辑均已执行。')

                result = (
                    '## 🧪 调试路由命中（暗号：charli）\n\n'
                    '已按「视为已提供图片」处理：未调用生图、未读取上传文件，直接用调试占位标记替换了文稿中的占位符。\n\n'
