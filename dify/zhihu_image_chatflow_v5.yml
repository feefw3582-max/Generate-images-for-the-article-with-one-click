app:
  description: 知乎文章/回答/想法智能配图助手（多轮交互版）。第一轮：用户输入文字草稿 → AI 识别形式（文章/回答/想法）与题材，输出「带插图位的完整文稿」（占位格式：回车【为大大推荐在这里插入一张xxxx的图片哦～】回车）以及每个插图位的生图提示词卡片；第二轮：用户三选一——回复「自动生图」用 Seedream 5.0 Lite 批量生图、直接在对话框上传自备图片、或回复暗号「charli」触发调试路由（不生成/上传任何图片，直接用调试占位标记替换文稿中的占位符，用于检验前置链路是否运行正确）；工作流收到图片后自动把占位符替换为图片，回传最终成稿。LLM 使用 DeepSeek：导入后请在「内容分析与插图规划」节点重新选择你自己的 DeepSeek V4 Flash 模型；Seedream 的 API 地址 / API Key / 模型 ID 请在工作流「设置 → 环境变量」中配置。
  icon: 📝
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 知乎智能配图助手（交互版 v5·含 charli 调试路由）
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
