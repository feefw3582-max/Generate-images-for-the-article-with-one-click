    file_upload:
      allowed_file_types:
        - image
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: true
      fileUploadConfig:
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 10
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 10
    opening_statement: 你好！我是你的知乎配图助手 📝 请把你的文字草稿发给我（文章 / 回答 / 想法均可）。我会先输出「带插图位的完整文稿」和每个插图位的生图提示词；之后你可以回复「自动生图」让我用 AI 配图，或直接上传你自己的图片。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 帮我分析一篇关于城市通勤的文章
      - 帮我分析一段关于养猫日常的想法
    suggested_questions_after_answer:
